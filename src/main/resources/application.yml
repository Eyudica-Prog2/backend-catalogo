spring:
  application:
    name: backend-catalogo

  datasource:
    # No defaults on purpose: every value comes from the environment (.env / docker compose).
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; Hibernate only checks that it matches.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    deserialization:
      # Unknown extra fields may be added inside contract v1: they must be ignored.
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8081}
  error:
    whitelabel:
      enabled: false
  servlet:
    encoding:
      charset: UTF-8

app:
  jwt:
    # HS256 secret shared with backend-turnos. Minimum 32 characters (256 bits).
    secret: ${APP_JWT_SECRET}
    expiry-seconds: ${APP_JWT_EXPIRY_SECONDS}
  secrets:
    # Source for the derived AES-256-GCM key used to encrypt persisted secrets.
    key: ${APP_SECRETS_KEY}
  cors:
    # Comma separated origins; empty means "no cross-origin access allowed".
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

catedra:
  api:
    base-url: ${CATEDRA_API_BASE_URL}
    login: ${CATEDRA_LOGIN:}
    password: ${CATEDRA_PASSWORD:}
    jwt: ${CATEDRA_JWT:}
  http:
    connect-timeout-ms: ${CATEDRA_HTTP_CONNECT_TIMEOUT_MS}
    read-timeout-ms: ${CATEDRA_HTTP_READ_TIMEOUT_MS}
  retry:
    max-attempts: ${CATEDRA_RETRY_MAX_ATTEMPTS:3}
    initial-backoff-ms: ${CATEDRA_RETRY_INITIAL_BACKOFF_MS:300}
    max-backoff-ms: ${CATEDRA_RETRY_MAX_BACKOFF_MS:3000}
  redis:
    host: ${CATEDRA_REDIS_HOST}
    port: ${CATEDRA_REDIS_PORT}
    username: ${CATEDRA_REDIS_USERNAME}
    password: ${CATEDRA_REDIS_PASSWORD}
    read-namespace: ${CATEDRA_REDIS_READ_NAMESPACE}
    write-namespace: ${CATEDRA_REDIS_WRITE_NAMESPACE}
  kafka:
    bootstrap-servers: ${CATEDRA_KAFKA_BOOTSTRAP_SERVERS}
    consumer-group-id: ${CATEDRA_KAFKA_CONSUMER_GROUP_ID}
    catalog-topic: ${CATEDRA_KAFKA_CATALOG_TOPIC}
    actions-topic: ${CATEDRA_KAFKA_ACTIONS_TOPIC}
    phone-topic: ${CATEDRA_KAFKA_PHONE_TOPIC}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} : %msg%n"
  level:
    root: INFO
    ar.edu.unlp.turnos.catalog: INFO
