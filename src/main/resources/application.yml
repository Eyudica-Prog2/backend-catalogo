spring:
  application:
    name: backend-catalogo

  datasource:
    # No defaults on purpose: every value comes from the environment (.env / docker compose).
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; Hibernate only checks that it matches.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    deserialization:
      # Unknown extra fields may be added inside contract v1: they must be ignored.
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false

  kafka:
    # Broker coordinates of the catedra, same externalized values as catedra.kafka.
    bootstrap-servers: ${CATEDRA_KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${CATEDRA_KAFKA_CONSUMER_GROUP_ID}
      # The offset of a record is committed only after the listener finished persisting
      # its effects (contract v1, section 16): manual acknowledgement, never automatic.
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # One record acknowledged at a time: the offset moves only when its effects are stored.
      ack-mode: record

server:
  port: ${SERVER_PORT:8081}
  error:
    whitelabel:
      enabled: false
  servlet:
    encoding:
      charset: UTF-8

app:
  jwt:
    # HS256 secret shared with backend-turnos. Minimum 32 characters (256 bits).
    secret: ${APP_JWT_SECRET}
    expiry-seconds: ${APP_JWT_EXPIRY_SECONDS}
    # Lifetime used when the client asks to be remembered at POST /api/authenticate.
    remember-me-expiry-seconds: ${APP_JWT_REMEMBER_ME_EXPIRY_SECONDS:604800}
  secrets:
    # Source for the derived AES-256-GCM key used to encrypt persisted secrets.
    key: ${APP_SECRETS_KEY}
  cors:
    # Comma separated origins; empty means "no cross-origin access allowed".
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  sync:
    scheduler:
      # Periodic catch up that recovers from lost CatalogUpdated notifications (section 16).
      enabled: ${APP_SYNC_SCHEDULER_ENABLED:true}
      # First run after the boot, then one run every fixed delay; milliseconds.
      initial-delay-ms: ${APP_SYNC_SCHEDULER_INITIAL_DELAY_MS:60000}
      fixed-delay-ms: ${APP_SYNC_SCHEDULER_FIXED_DELAY_MS:300000}
    kafka:
      # false starts the service without attaching a consumer to the catalog topic, which is
      # how the automated tests (and an operator without a broker) run the service.
      listener-enabled: ${APP_SYNC_KAFKA_LISTENER_ENABLED:true}

catedra:
  api:
    base-url: ${CATEDRA_API_BASE_URL}
    login: ${CATEDRA_LOGIN:}
    password: ${CATEDRA_PASSWORD:}
    jwt: ${CATEDRA_JWT:}
  http:
    connect-timeout-ms: ${CATEDRA_HTTP_CONNECT_TIMEOUT_MS}
    read-timeout-ms: ${CATEDRA_HTTP_READ_TIMEOUT_MS}
  retry:
    max-attempts: ${CATEDRA_RETRY_MAX_ATTEMPTS:3}
    initial-backoff-ms: ${CATEDRA_RETRY_INITIAL_BACKOFF_MS:300}
    max-backoff-ms: ${CATEDRA_RETRY_MAX_BACKOFF_MS:3000}
  redis:
    host: ${CATEDRA_REDIS_HOST}
    port: ${CATEDRA_REDIS_PORT}
    username: ${CATEDRA_REDIS_USERNAME}
    password: ${CATEDRA_REDIS_PASSWORD}
    read-namespace: ${CATEDRA_REDIS_READ_NAMESPACE}
    write-namespace: ${CATEDRA_REDIS_WRITE_NAMESPACE}
  kafka:
    bootstrap-servers: ${CATEDRA_KAFKA_BOOTSTRAP_SERVERS}
    consumer-group-id: ${CATEDRA_KAFKA_CONSUMER_GROUP_ID}
    catalog-topic: ${CATEDRA_KAFKA_CATALOG_TOPIC}
    actions-topic: ${CATEDRA_KAFKA_ACTIONS_TOPIC}
    phone-topic: ${CATEDRA_KAFKA_PHONE_TOPIC}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} : %msg%n"
  level:
    root: INFO
    ar.edu.um.turnos.catalog: INFO
